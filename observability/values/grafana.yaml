# grafana/grafana 10.5.15 (Grafana 12.3.1), release "grafana" in namespace observability. No volume: everything it shows
# is provisioned (datasources, the Commerce dashboard) and the MCP service account is re-created by install.sh when lost.
# Anonymous access is off; the admin login is in the Secret grafana-admin that install.sh generates (never printed).
persistence: {enabled: false}
initChownData: {enabled: false}
testFramework: {enabled: false}

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  auth.anonymous: {enabled: false}
  users: {allow_sign_up: false}
  analytics: {reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false}
  news: {news_feed_enabled: false}

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc
        isDefault: true
        jsonData:
          timeInterval: 15s
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc:3200
        jsonData:
          serviceMap: {datasourceUid: prometheus}
          nodeGraph: {enabled: true}
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - {key: service.name, value: service}
            queries:
              - name: Request rate
                query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[1m]))'
              - name: Error rate
                query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[1m]))'

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: commerce
        orgId: 1
        folder: Commerce
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/commerce
# The ConfigMap is made by install.sh from observability/dashboards/*.json.
dashboardsConfigMaps:
  commerce: grafana-dashboards-commerce

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: "1", memory: 384Mi}
