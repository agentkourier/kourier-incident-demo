# Grafana's MCP server (grafana/mcp-grafana 2.1.1) pointed at the demo's Grafana, read-only.
# Manifest only: the demo does not need it running.
#
# Flags and environment checked against upstream README.md and Dockerfile at tag v2.1.1:
#   --transport streamable-http   the image's ENTRYPOINT defaults to "--transport sse --address
#                                 0.0.0.0:8000", so command is replaced in full below.
#   --address                     listen host:port (default localhost:8000).
#   --endpoint-path               Streamable HTTP path, default /mcp (left at the default).
#   --allowed-hosts               Host header allowlist; the default is loopback only, so the
#                                 Service names kagent connects with are listed.
#   --healthz-address             a separate /healthz listener without Host checks, for the probes.
#   --disable-write               no create/update tools.
#   --enabled-tools               tool categories to register (names as in the --disable-<category> flags).
#   GRAFANA_URL                   the Grafana base URL.
#   GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE  file holding the service-account token, read on every
#                                 request (README "Reading the service account token from a file").
# Not set: --server-auth-token / MCP_GRAFANA_SERVER_TOKEN (caller authentication). Without it the
# server starts on a non-loopback address but logs a security error at startup (README "Caller
# Authentication").
# The image's user is mcp-grafana, UID 1000 (Dockerfile: useradd -r -u 1000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: grafana-mcp, app.kubernetes.io/component: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana-mcp, app.kubernetes.io/component: mcp-server}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: grafana/mcp-grafana:2.1.1@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
          command: [/app/mcp-grafana]
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8084
            - --allowed-hosts=grafana-mcp.demo-tools.svc.cluster.local:8084,grafana-mcp.demo-tools.svc:8084,grafana-mcp.demo-tools:8084,grafana-mcp:8084
            - --healthz-address=:8080
            - --disable-write
            - --usage-stats=disabled  # no anonymous usage reports to Grafana Labs
            - --enabled-tools=search,datasource,prometheus,tempo,alerting,dashboard,navigation
          env:
            - name: GRAFANA_URL
              value: http://grafana.observability.svc.cluster.local
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/grafana/token
          ports:
            - {name: mcp, containerPort: 8084}
            - {name: healthz, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: healthz}
          livenessProbe:
            httpGet: {path: /healthz, port: healthz}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: grafana-token, mountPath: /var/run/secrets/grafana, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: grafana-token
          secret: {secretName: demo-grafana-token, items: [{key: token, path: token}]}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: grafana-mcp, app.kubernetes.io/component: mcp-server}
spec:
  selector: {app.kubernetes.io/name: grafana-mcp}
  ports:
    - {name: mcp, port: 8084, targetPort: mcp}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: grafana-mcp, namespace: kagent}
spec:
  description: "Grafana, read-only: dashboards, Prometheus and Loki queries, alert rules"
  protocol: STREAMABLE_HTTP
  url: http://grafana-mcp.demo-tools.svc.cluster.local:8084/mcp
