# GitHub's official MCP server (github/github-mcp-server v2.0.3), read-only, with only the repos
# and pull_requests toolsets.
#
# Flags and behaviour checked against upstream at tag v2.0.3:
#   http             the Streamable HTTP subcommand (cmd/github-mcp-server/main.go, httpCmd;
#                    docs/streamable-http.md "Basic HTTP Server"). MCP is served at "/"
#                    (pkg/http/handler.go mounts the handler at "/").
#   --port           HTTP port, default 8082 (main.go, httpCmd.Flags().Int("port", 8082, ...)).
#   --read-only      offer read-only tools only (README "Read-Only Mode"; env GITHUB_READ_ONLY=1).
#   --toolsets       comma-separated toolset allowlist (README "Specifying Toolsets"; env
#                    GITHUB_TOOLSETS, which wins over the flag). repos and pull_requests are in
#                    README "Available Toolsets".
#   token            in http mode the server reads no token from its environment: every request
#                    must carry "Authorization: Bearer <token>" or gets 401
#                    (pkg/http/middleware/token.go, ExtractUserToken). GITHUB_PERSONAL_ACCESS_TOKEN
#                    is the stdio mode's variable only. So kagent sends the header, from the Secret
#                    kagent/demo-github-token (key token, value "Bearer <token>"), through
#                    headersFrom below; the same Secret shape kagent's own contrib/tools/github-mcp-server
#                    chart uses.
# The image runs as root by default (distroless base, no USER); the pod pins distroless's nonroot UID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: github-mcp, app.kubernetes.io/component: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: github-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: github-mcp, app.kubernetes.io/component: mcp-server}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: ghcr.io/github/github-mcp-server:v2.0.3@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132
          args:
            - http
            - --port=8084
            - --read-only
            - --toolsets=repos,pull_requests
          ports:
            - {name: mcp, containerPort: 8084}
          readinessProbe:
            tcpSocket: {port: mcp}
          livenessProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: github-mcp, app.kubernetes.io/component: mcp-server}
spec:
  selector: {app.kubernetes.io/name: github-mcp}
  ports:
    - {name: mcp, port: 8084, targetPort: mcp}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: github-mcp, namespace: kagent}
spec:
  description: "GitHub, read-only: repositories and pull requests"
  protocol: STREAMABLE_HTTP
  url: http://github-mcp.demo-tools.svc.cluster.local:8084/
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: demo-github-token, key: token}
