apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: rollout-mcp, app.kubernetes.io/component: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rollout-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rollout-mcp, app.kubernetes.io/component: mcp-server}
    spec:
      serviceAccountName: rollout-mcp
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: demo-mcp:dev
          imagePullPolicy: IfNotPresent
          command: [/rollout-mcp]
          args:
            - --allowed-namespace=commerce
            - --allowed-deployments=payments
          env:
            - name: GOMEMLIMIT
              value: 56MiB

          ports:
            - {name: mcp, containerPort: 8084}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
          livenessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
