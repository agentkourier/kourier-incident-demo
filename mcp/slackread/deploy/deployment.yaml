apiVersion: apps/v1
kind: Deployment
metadata:
  name: slackread-mcp
  namespace: demo-tools
  labels: {app.kubernetes.io/name: slackread-mcp, app.kubernetes.io/component: mcp-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: slackread-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: slackread-mcp, app.kubernetes.io/component: mcp-server}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: demo-mcp:dev
          imagePullPolicy: IfNotPresent
          command: [/slackread-mcp]
          args:
            - --slack-ids=/etc/demo-slack-ids/slack-ids.yaml
            - --channels=checkout-alerts,payments-ops,incidents
          env:
            - name: GOMEMLIMIT
              value: 56MiB
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-ic-slack, key: bot-token}
          ports:
            - {name: mcp, containerPort: 8084}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
          livenessProbe:
            httpGet: {path: /healthz, port: mcp}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: slack-ids, mountPath: /etc/demo-slack-ids, readOnly: true}
      volumes:
        - name: slack-ids
          secret: {secretName: demo-slack-ids, items: [{key: slack-ids.yaml, path: slack-ids.yaml}]}
