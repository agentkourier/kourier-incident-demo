# checkout, owned by the checkout team. It calls payments and decodes the authorised amount as integer cents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: commerce
  labels: {app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: commerce}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: checkout}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: commerce
        app.kubernetes.io/version: v1.8.0
      annotations:
        demo.agentkourier.dev/git-revision: ee9fa887f7f96c876965d84bb5889aee590a581c
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: checkout
          image: demo-checkout:v1.8.0
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: PAYMENTS_URL, value: "http://payments.commerce.svc:8080"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc:4317"}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=commerce
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: commerce
  labels: {app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: commerce}
spec:
  selector: {app.kubernetes.io/name: checkout}
  ports: [{name: http, port: 8080, targetPort: http}]
