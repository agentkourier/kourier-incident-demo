# Shared Helm values for the demo's three Agent Kourier releases. install.sh picks the chart (the release, or an
# agent-kourier checkout's with the local image) and adds the per-release names on the command line.
rbac:
  secretNamespaces: [agent-kourier]
persistence:
  storageClassName: standard
  retainOnUninstall: false
tokenRefresh:
  enabled: true
  dex:
    tokenURL: http://dex.dex.svc.cluster.local:5556/dex/token
    clientId: agent-kourier-binding
