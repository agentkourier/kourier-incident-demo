# incident-commander in #incidents. It starts when Pager posts an escalation (the escalation tool posts one only after
# checking the evidence) and declares the incident and pages the owning team; when Pager posts that the impacted
# service recovered, it writes the summary. A person can still start it with a mention. No tool of this agent needs an
# approval, so approvals are off: any approval request from it is denied.
apiVersion: agentkourier.dev/v1alpha1
kind: Binding
metadata: {name: incident-commander, namespace: agent-kourier}
spec:
  agent:
    backendRef: {name: agents}
    namespace: kagent
    name: incident-commander
  identity:
    userId: incident-commander
    tokenSecretRef: {name: __RELEASE__-token}
  chat:
    connectionRef: {name: slack}
    channel: __INCIDENTS_CHANNEL__
    output: live
    threadReplies: mention
    triggers:
      - type: mention
      - type: botMessage
        from: {id: __PAGER_BOT__}
        match:
          text: '^Escalation · '
        limits:
          rateLimit: {maxRuns: 3, per: 30m, maxConcurrent: 1}
          maxRunsPerDay: 20
        promptTemplate: |
          An agent escalated an incident to {{ .Channel }} after the escalation tool checked its evidence ({{ .Link }}).
          Declare the incident, read the alert thread it links, and page the owner of the suspected cause.
      - type: botMessage
        from: {id: __PAGER_BOT__}
        match:
          text: '^Resolved · '
        limits:
          rateLimit: {maxRuns: 3, per: 30m, maxConcurrent: 1}
          maxRunsPerDay: 20
        promptTemplate: |
          The impacted service recovered ({{ .Link }}). Write the incident summary.
  interactions:
    toolApprovals: false
  feedback: {enabled: true}
